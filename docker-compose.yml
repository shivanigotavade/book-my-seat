# G16: clean-clone runtime. `docker compose up --build` with only Docker
# installed reaches /health/ready = 200. App reads PORT/DATABASE_URL/etc
# from the environment (same image as prod). Flyway migrates on startup and
# retries connects, so cold starts survive a still-warming database.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: bookmyseat
      POSTGRES_PASSWORD: bookmyseat
      POSTGRES_DB: bookmyseat
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookmyseat -d bookmyseat"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/bookmyseat
      DB_USER: bookmyseat
      DB_PASSWORD: bookmyseat
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-prod-min-32-chars-please}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-admin-token}
      AUTH_DEV_TOKEN_ENDPOINT_ENABLED: "true"
      HIKARI_MAX_POOL_SIZE: "10"
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.3.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    profiles:
      - observability

volumes:
  postgres-data:
