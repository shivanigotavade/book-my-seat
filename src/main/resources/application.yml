server:
  port: ${PORT:8080}
  tomcat:
    max-connections: 2000
    accept-count: 500
    threads:
      max: 200

spring:
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/bookmyseat}
    username: ${DB_USER:bookmyseat}
    password: ${DB_PASSWORD:bookmyseat}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:15}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      connection-timeout: 30000
      max-lifetime: 600000
      auto-commit: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    serialization:
      fail-on-empty-beans: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-in-prod-min-32-chars-please}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
  admin:
    token: ${ADMIN_TOKEN:dev-admin-token}
  auth:
    dev-token-endpoint-enabled: ${AUTH_DEV_TOKEN_ENDPOINT_ENABLED:true}

logging:
  level:
    root: INFO
    com.bookmyseat: INFO
