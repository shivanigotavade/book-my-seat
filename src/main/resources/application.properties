# Book My Seat — externalised configuration (G1). Every value ships a safe
# local default and is overridable from the environment (see README).
server.port=${PORT:8080}
server.tomcat.max-connections=2000
server.tomcat.accept-count=500
server.tomcat.threads.max=200

spring.threads.virtual.enabled=true
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/book_my_seat}
#spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:book_my_seat}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:15}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.auto-commit=true
# G12: bound worst-case waits per session. Breaches surface as SQLState
# 55P03 and flow into the contention retry, then 429 — never a 5xx.
spring.datasource.hikari.connection-init-sql=SELECT set_config('lock_timeout', '8s', false), set_config('statement_timeout', '25s', false)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# G16: survive cold starts against a still-warming database.
spring.flyway.connect-retries=30
spring.flyway.connect-retries-interval=2
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.serialization.fail-on-empty-beans=false

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

app.jwt.secret=${JWT_SECRET:dev-secret-change-in-prod-min-32-chars-please}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}
app.admin.token=${ADMIN_TOKEN:dev-admin-token}
app.auth.dev-token-endpoint-enabled=${AUTH_DEV_TOKEN_ENDPOINT_ENABLED:true}

logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.bookmyseat=${LOG_LEVEL:INFO}
